<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SiteGuard | حارس موقعك{% endblock %}</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--fg:#e2e8f0;--muted:#94a3b8;--accent:#22c55e;--high:#ef4444;--medium:#f59e0b;--low:#38bdf8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--fg);line-height:1.7}
a{color:var(--accent)}main{max-width:900px;margin:auto;padding:16px}
nav{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #334155}
.card{background:var(--card);border-radius:12px;padding:20px;margin:16px 0}
button,.btn{background:var(--accent);color:#052e16;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.secondary,button.secondary{background:#334155;color:var(--fg)}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:var(--fg);margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.flash{background:#334155;padding:10px 14px;border-radius:8px;margin:8px 0}
.sev{font-weight:700;padding:2px 8px;border-radius:6px;font-size:.85em}
.sev.high{background:var(--high)}.sev.medium{background:var(--medium);color:#000}.sev.low{background:var(--low);color:#000}
code{background:#0f172a;padding:2px 6px;border-radius:4px;direction:ltr;display:inline-block;word-break:break-all}
.score{font-size:3em;font-weight:800}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #334155;text-align:right}
form.inline{display:inline}
</style>
</head>
<body>
<nav>
  <a href="{{ url_for('index') }}"><strong>🛡️ SiteGuard</strong></a>
  <div>
  {% if user %}
    <a href="{{ url_for('dashboard') }}">لوحة التحكم</a>
    <form class="inline" method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button class="secondary">خروج</button></form>
  {% else %}
    <a href="{{ url_for('login') }}">دخول</a> · <a href="{{ url_for('signup') }}">حساب جديد</a>
  {% endif %}
  </div>
</nav>
<main>
{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}
</main>
</body>
</html>
